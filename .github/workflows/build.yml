name: Refresh releases

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-releases
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.28.1"
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch current release versions
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run sync:releases
      - name: Write candidate release manifest
        run: pnpm run report:releases -- --write "$RUNNER_TEMP/candidate-release-versions.json"
      - name: Check deployed release versions
        id: release-changes
        env:
          DEPLOYED_MANIFEST_URL: https://dl.rustfs.com/release-versions.json
        shell: bash
        run: |
          set -euo pipefail

          candidate="$RUNNER_TEMP/candidate-release-versions.json"
          deployed="$RUNNER_TEMP/deployed-release-versions.json"

          if ! curl --fail --silent --show-error --location \
            "$DEPLOYED_MANIFEST_URL" --output "$deployed"; then
            echo "No deployed release manifest found; a deployment is required."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq --exit-status --slurpfile candidate "$candidate" '
            def versions:
              [.entries[] | { key: .repo, value: (.latest.tag_name // null) }]
              | from_entries;
            versions == ($candidate[0] | versions)
          ' "$deployed" > /dev/null; then
            echo "Release versions are already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream release versions changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Cloudflare deployment
        if: steps.release-changes.outputs.changed == 'true'
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$CLOUDFLARE_DEPLOY_HOOK_URL" ]]; then
            echo "::error::CLOUDFLARE_DEPLOY_HOOK_URL is not configured"
            exit 1
          fi

          curl --fail --silent --show-error --request POST \
            "$CLOUDFLARE_DEPLOY_HOOK_URL" > /dev/null
          echo "Cloudflare deployment triggered."
